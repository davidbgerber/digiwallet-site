<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DigiWallet</title>
<style>
  :root { color-scheme: light dark; --fg: #1c1c1e; --muted: #5a5a60; --bg: #ffffff; --accent: #0a84ff; }
  @media (prefers-color-scheme: dark) { :root { --fg: #f2f2f7; --muted: #a1a1a8; --bg: #000000; } }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 17px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 680px; margin: 0 auto; padding: 40px 20px 64px; }
  h1 { font-size: 30px; margin: 0 0 4px; }
  h2 { font-size: 20px; margin: 32px 0 8px; }
  p, li { color: var(--fg); }
  .muted { color: var(--muted); font-size: 15px; }
  .summary { border-left: 4px solid var(--accent); padding: 4px 0 4px 16px; margin: 24px 0; }
  ul { padding-left: 22px; }
  a { color: var(--accent); }
</style>
</head>
<body>
<main>
  <h1>DigiWallet</h1>
  <p class="muted">Your cards, safe on your phone</p>
  <p>Keep photos of your insurance cards, IDs and membership cards on your iPhone, with every number ready to copy. Private, offline and locked with Face ID.</p>
  <ul>
    <li><a href="support/">Support</a></li>
    <li><a href="privacy/">Privacy Policy</a></li>
  </ul>

</main>
</body>
</html>
